name: Deploy to GitHub Pages and REG.RU

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Add .nojekyll file for GitHub Pages
        run: touch ./dist/.nojekyll

      - name: Create clean version for REG.RU (without .nojekyll)
        run: |
          # Копируем dist в отдельную папку без .nojekyll
          mkdir -p ./dist-regru
          cp -r ./dist/* ./dist-regru/
          # Проверяем содержимое обеих папок
          echo "GitHub Pages files:"
          ls -la ./dist
          echo "REG.RU files:"
          ls -la ./dist-regru

      - name: List build output
        run: ls -la ./dist

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Upload artifact for REG.RU
        uses: actions/upload-artifact@v4
        with:
          name: regru-site
          path: "./dist-regru"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-regru:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact for REG.RU
        uses: actions/download-artifact@v4
        with:
          name: regru-site
          path: ./dist

      - name: Check files for REG.RU
        run: ls -la ./dist

      - name: Deploy to REG.RU via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || '21' }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR || '/www/' }}
          protocol: ftp
          dangerous-clean-slate: true
