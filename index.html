<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password generator</title>
  </head>
  <body>
    <main>
      <div class="lang-switcher">
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="ru">RU</button>
      </div>
      <h1><span>Password</span><span>generator</span></h1>
      <section class="password-generator">
        <div class="password-generator__result">phmH)7D?$I1B4</div>
        <div class="password-generator__buttons">
          <button class="password-generator__btn" id="button-generate">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org"
            >
              <path
                d="M21 4V10H15"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M19.8 15C19.1 17.1 17.6 18.9 15.7 20.1C13.8 21.3 11.5 21.6 9.4 21C7.3 20.4 5.5 19 4.3 17.1C3.1 15.2 2.7 12.9 3.2 10.8C3.7 8.7 5 6.9 6.9 5.7C8.8 4.5 11.1 4.1 13.2 4.6C15.3 5.1 17.1 6.4 18.3 8.2L21 10"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button class="password-generator__btn" id="button-copy">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org"
            >
              <path
                d="M8 4V16C8 17.1046 8.89543 18 10 18H18C19.1046 18 20 17.1046 20 16V7.24264C20 6.71221 19.7893 6.20349 19.4142 5.82843L16.1716 2.58579C15.7965 2.21071 15.2878 2 14.7574 2H10C8.89543 2 8 2.89543 8 4Z"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M16 22H6C4.89543 22 4 21.1046 4 20V8"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
        <div class="password-generator__success-copy" style="display: none">
          Успешно скопировано
        </div>
      </section>

      <section class="password-settings">
        <div class="password-settings__length">
          <h3 class="password-settings__length-title">
            <span data-i18n="length">Длина:</span>
            <span class="password-settings__length-value">16</span>
          </h3>
          <input
            type="range"
            min="4"
            max="24"
            step="1"
            value="12"
            name="length"
            class="password-settings__length-range"
            aria-label="Длина пароля"
          />
        </div>
        <div class="password-settings__symbols">
          <h3 class="password-settings__symbols-title" data-i18n="use">
            Использовать:
          </h3>
          <div class="password-settings__symbols-list">
            <label for="uppercase" class="password-settings__symbols-item">
              <input
                type="checkbox"
                id="uppercase"
                class="password-settings__check"
                name="includeUppercase"
                checked
              />
              <span data-i18n="uppercase">Заглавные буквы</span>
            </label>
            <label for="lowercase" class="password-settings__symbols-item">
              <input
                type="checkbox"
                id="lowercase"
                class="password-settings__check"
                name="includeLowercase"
                checked
              />
              <span data-i18n="lowercase">Строчные буквы</span>
            </label>
            <label for="numbers" class="password-settings__symbols-item">
              <input
                type="checkbox"
                id="numbers"
                class="password-settings__check"
                name="includeNumbers"
                checked
              />
              <span data-i18n="numbers">Числа</span>
            </label>
            <label for="symbols" class="password-settings__symbols-item">
              <input
                type="checkbox"
                id="symbols"
                class="password-settings__check"
                name="includeSymbols"
                checked
              />
              <span data-i18n="symbols">Символы</span>
            </label>
          </div>
        </div>
        <div class="password-settings__symbols">
          <h3 class="password-settings__symbols-title">
            <span data-i18n="exclude">Исключить</span>
          </h3>
          <div class="password-settings__symbols-list">
            <label for="exclude" class="password-settings__symbols-item">
              <input
                type="checkbox"
                id="exclude"
                class="password-settings__check"
                name="exclude"
              />
              <span>0, O, 1, l, I, |</span>
            </label>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
