<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="head_title">Password generator site</title>
    <style>
      :root {
        --color-bg-page: #000;

        --title-font-size: 4rem;
        --title-weight: 700;
        --title-color-text: transparent;
        --title-gradient: linear-gradient(to bottom, #fff 30%, transparent 50%);
        --title-stroke: 0.0625rem;
        --title-stroke-color: rgb(255 255 255 / 0.5);

        --button-color-bg: #007bff;
        --button-color-text: #fff;

        --font-size-base: clamp(12, 4vw, 16px);
        --color-text-base: #fff;
      }
      html {
        font-family: monospace;
        font-size: var(--font-size-base);
        color: var(--color-text-base);
        font-feature-settings: normal;
        font-variation-settings: normal;
        -webkit-text-size-adjust: 100%;
        background-color: var(--color-bg-page);
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: 4rem 2rem 5rem;
        margin: 0;
        box-sizing: border-box;

        *,
        *::before,
        *::after {
          box-sizing: inherit;
        }
      }

      main {
        width: min(100%, 56.25rem);
      }

      h1 {
        display: flex;
        flex-direction: column;
        margin: 0;
        margin-block-end: 2rem;
        font-family: monospace;
        font-size: var(--title-font-size);
        font-weight: var(--title-weight);
        line-height: 1;
        text-align: center;
        text-transform: uppercase;
        color: transparent;
        background: var(--title-gradient);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-stroke: var(--title-stroke) var(--title-stroke-color);
        paint-order: stroke fill;
      }
      .lang-switcher {
        position: absolute;
        top: 1rem;
        right: 1rem;
      }
      .password-generator {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 0.5rem;
        margin-block-end: 1rem;
        padding: 1rem 1.5rem;
        border-radius: 12px;
        font-size: 1.5rem;
        text-align: center;
        background-color: #191919;
      }
      .password-generator__result {
        word-break: break-all;
      }
      .password-generator__buttons {
        display: flex;
        gap: 1rem;
      }

      @media (orientation: portrait) and (width <= 768px) {
        .password-generator__buttons {
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          padding: 1rem 2rem;

          &::before {
            content: "";
            position: absolute;
            top: -20px;
            left: 0;
            right: 0;
            bottom: 0;
            mask-image: linear-gradient(
              to top,
              #000000 20%,
              transparent calc(100% - 20%)
            );
            backdrop-filter: blur(8px);
            pointer-events: none;
          }
        }

        .password-generator__btn {
          flex: 1;
        }
      }
      .password-generator__btn {
        display: grid;
        place-items: center;
        min-width: 2.75rem;
        min-height: 2.75rem;
        border: 0;
        color: var(--button-color-text);
        background-color: var(--button-color-bg);
        border-radius: 6px;
        cursor: pointer;
        z-index: 1;
      }
      .password-settings {
        padding: 1.5rem;
        border: 1px solid #333;
        border-radius: 12px;
      }
      .password-settings__length-range {
        width: 100%;
      }
      .password-settings__symbols {
        margin-block-start: 1rem;
      }
      .password-settings__length-title,
      .password-settings__symbols-title {
        margin: 0;
        margin-block-end: 1rem;
      }
      .password-settings__symbols-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 1rem;
        flex-flow: row wrap;
      }
      .password-settings__symbols-item {
        padding: 1rem;
        border-radius: 6px;
        background-color: #121212;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="lang-switcher">
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="ru">RU</button>
      </div>
      <h1 data-i18n="title"><span>Password</span><span>generator</span></h1>
      <section class="password-generator">
        <div class="password-generator__result">phmH)7D?$I1B4</div>
        <div class="password-generator__buttons">
          <button class="password-generator__btn" id="button-generate">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org"
            >
              <path
                d="M21 4V10H15"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M19.8 15C19.1 17.1 17.6 18.9 15.7 20.1C13.8 21.3 11.5 21.6 9.4 21C7.3 20.4 5.5 19 4.3 17.1C3.1 15.2 2.7 12.9 3.2 10.8C3.7 8.7 5 6.9 6.9 5.7C8.8 4.5 11.1 4.1 13.2 4.6C15.3 5.1 17.1 6.4 18.3 8.2L21 10"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <button class="password-generator__btn" id="button-copy">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org"
            >
              <path
                d="M8 4V16C8 17.1046 8.89543 18 10 18H18C19.1046 18 20 17.1046 20 16V7.24264C20 6.71221 19.7893 6.20349 19.4142 5.82843L16.1716 2.58579C15.7965 2.21071 15.2878 2 14.7574 2H10C8.89543 2 8 2.89543 8 4Z"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M16 22H6C4.89543 22 4 21.1046 4 20V8"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
        <div class="password-generator__success-copy" style="display: none">
          Успешно скопировано
        </div>
      </section>

      <section class="password-settings">
        <div class="password-settings__length">
          <h3 class="password-settings__length-title">
            Длина: <span class="password-settings__length-value">16</span>
          </h3>
          <input
            type="range"
            min="4"
            max="24"
            step="1"
            value="12"
            name="length"
            class="password-settings__length-range"
            aria-label="Длина пароля"
          />
        </div>
        <div class="password-settings__symbols">
          <h3 class="password-settings__symbols-title">Использовать:</h3>
          <div class="password-settings__symbols-list">
            <label for="uppercase" class="password-settings__symbols-item">
              <input
                type="checkbox"
                id="uppercase"
                class="password-settings__check"
                name="includeUppercase"
                checked
              />
              <span>Заглавные буквы</span>
            </label>
            <label for="lowercase" class="password-settings__symbols-item">
              <input
                type="checkbox"
                id="lowercase"
                class="password-settings__check"
                name="includeLowercase"
                checked
              />
              <span>Строчные буквы</span>
            </label>
            <label for="numbers" class="password-settings__symbols-item">
              <input
                type="checkbox"
                id="numbers"
                class="password-settings__check"
                name="includeNumbers"
                checked
              />
              <span>Числа</span>
            </label>
            <label for="symbols" class="password-settings__symbols-item">
              <input
                type="checkbox"
                id="symbols"
                class="password-settings__check"
                name="includeSymbols"
                checked
              />
              <span>Символы</span>
            </label>
          </div>
        </div>
        <div class="password-settings__symbols">
          <h3 class="password-settings__symbols-title">Исключить:</h3>
          <div class="password-settings__symbols-list">
            <label for="exclude" class="password-settings__symbols-item">
              <input
                type="checkbox"
                id="exclude"
                class="password-settings__check"
                name="exclude"
              />
              <span>0, O, 1, l, I, |</span>
            </label>
          </div>
        </div>
      </section>
    </main>
  </body>
  <script>
    class PasswordGenerator {
      static CHAR_SETS = {
        lowercase: "abcdefghijklmnopqrstuvwxyz",
        uppercase: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
        numbers: "0123456789",
        symbols: "!@#$%^&*()_+-=[]{}|;:,.<>?",
      };
      static CHAR_SETS_EXCLUDE = {
        lowercase: "abcdefghijkmnopqrstuvwxyz",
        uppercase: "ABCDEFGHJKLMNPQRSTUVWXYZ",
        numbers: "23456789",
        symbols: "!@#$%^&*()_+-=[]{};:,.<>?",
      };

      constructor() {
        this.settings = {
          includeUppercase: true,
          includeLowercase: true,
          includeNumbers: true,
          includeSymbols: true,
          exclude: false,
        };
        this.length = 16;
      }

      setSettings(settings) {
        this.settings = { ...this.settings, ...settings };
      }

      setLength(length) {
        this.length = Math.max(4, Math.min(64, parseInt(length) || 16));
      }

      getAvailableChars() {
        let chars = "";
        if (this.settings.includeLowercase)
          chars += this.settings.exclude
            ? PasswordGenerator.CHAR_SETS_EXCLUDE.lowercase
            : PasswordGenerator.CHAR_SETS.lowercase;
        if (this.settings.includeUppercase)
          chars += this.settings.exclude
            ? PasswordGenerator.CHAR_SETS_EXCLUDE.uppercase
            : PasswordGenerator.CHAR_SETS.uppercase;
        if (this.settings.includeNumbers)
          chars += this.settings.exclude
            ? PasswordGenerator.CHAR_SETS_EXCLUDE.numbers
            : PasswordGenerator.CHAR_SETS.numbers;
        if (this.settings.includeSymbols)
          chars += this.settings.exclude
            ? PasswordGenerator.CHAR_SETS_EXCLUDE.symbols
            : PasswordGenerator.CHAR_SETS.symbols;
        return chars;
      }

      getRequiredCharSets() {
        const sets = [];
        if (this.settings.includeLowercase)
          this.settings.exclude
            ? sets.push(PasswordGenerator.CHAR_SETS_EXCLUDE.lowercase)
            : sets.push(PasswordGenerator.CHAR_SETS.lowercase);
        if (this.settings.includeUppercase)
          this.settings.exclude
            ? sets.push(PasswordGenerator.CHAR_SETS_EXCLUDE.uppercase)
            : sets.push(PasswordGenerator.CHAR_SETS.uppercase);
        if (this.settings.includeNumbers)
          this.settings.exclude
            ? sets.push(PasswordGenerator.CHAR_SETS_EXCLUDE.numbers)
            : sets.push(PasswordGenerator.CHAR_SETS.numbers);
        if (this.settings.includeSymbols)
          this.settings.exclude
            ? sets.push(PasswordGenerator.CHAR_SETS_EXCLUDE.symbols)
            : sets.push(PasswordGenerator.CHAR_SETS.symbols);
        return sets;
      }

      validate() {
        const availableChars = this.getAvailableChars();
        if (availableChars.length === 0) {
          return { valid: false, error: "no_settings" };
        }
        if (this.length < 4) {
          return { valid: false, error: "min_length" };
        }
        return { valid: true };
      }

      generate() {
        const validation = this.validate();
        if (!validation.valid) {
          throw new Error(validation.error);
        }

        const requiredSets = this.getRequiredCharSets();
        let password = "";

        requiredSets.forEach((charSet) => {
          const randomIndex = this.getRandomInt(0, charSet.length - 1);
          password += charSet[randomIndex];
        });

        const availableChars = this.getAvailableChars();
        while (password.length < this.length) {
          const randomIndex = this.getRandomInt(0, availableChars.length - 1);
          password += availableChars[randomIndex];
        }

        return this.shuffleString(password);
      }

      getRandomInt(min, max) {
        const range = max - min + 1;
        const randomValues = new Uint32Array(1);
        window.crypto.getRandomValues(randomValues);
        return min + (randomValues[0] % range);
      }

      shuffleString(str) {
        const array = str.split("");
        for (let i = array.length - 1; i > 0; i--) {
          const j = this.getRandomInt(0, i);
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array.join("");
      }
    }

    class App {
      constructor() {
        this.generator = new PasswordGenerator();

        this.elements = {
          passwordResult: document.querySelector(".password-generator__result"),
          generateBtn: document.querySelector("#button-generate"),
          copyBtn: document.querySelector("#button-copy"),
          lengthRange: document.querySelector(
            ".password-settings__length-range",
          ),
          lengthValue: document.querySelector(
            ".password-settings__length-value",
          ),
          settingInputs: document.querySelectorAll(".password-settings__check"),
          successCopyEl: document.querySelector(
            ".password-generator__success-copy",
          ),
        };

        this.init();
      }

      init() {
        this.bindEvents();
      }

      bindEvents() {
        this.elements.generateBtn.addEventListener("click", () =>
          this.generatePassword(),
        );

        this.elements.copyBtn.addEventListener("click", () =>
          this.copyPassword(),
        );

        this.elements.lengthRange.addEventListener("input", (event) => {
          const { value } = event.target;

          this.generator.setLength(value);
          this.elements.lengthValue.textContent = value;
        });

        this.elements.lengthRange.addEventListener("change", () =>
          this.generatePassword(),
        );

        this.elements.settingInputs.forEach((checkbox) => {
          checkbox.addEventListener("change", (event) => {
            const { name, checked } = event.target;
            this.generator.setSettings({ [name]: checked });
            this.generatePassword();
          });
        });
      }

      generatePassword() {
        try {
          const password = this.generator.generate();
          this.elements.passwordResult.textContent = password;
        } catch (e) {}
      }

      async copyPassword() {
        try {
          await navigator.clipboard.writeText(
            this.elements.passwordResult.textContent,
          );
        } catch (error) {
          console.error("Copy error:", error);
        }
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      new App();
    });
  </script>
</html>
